services:
  gameevaluate-frontend:
    build:
      context: ../..
      dockerfile: deploy/cd/Dockerfile
    image: gameevaluate-frontend:latest
    container_name: gameevaluate-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8999:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
