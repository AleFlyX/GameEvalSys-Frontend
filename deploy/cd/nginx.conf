server {
  listen ${NGINX_LISTEN_PORT};
  server_name ${NGINX_SERVER_NAME};

  root /usr/share/nginx/html;
  index index.html;

  set_real_ip_from ${NGINX_REAL_IP_FROM};
  real_ip_header ${NGINX_REAL_IP_HEADER};
  real_ip_recursive ${NGINX_REAL_IP_RECURSIVE};

  sendfile on;
  tcp_nopush on;
  keepalive_timeout ${NGINX_KEEPALIVE_TIMEOUT};
  server_tokens ${NGINX_SERVER_TOKENS};

  gzip ${NGINX_GZIP};
  gzip_types ${NGINX_GZIP_TYPES};
  gzip_min_length ${NGINX_GZIP_MIN_LENGTH};

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /api/v1/admin/monitor/stream {
    rewrite ^/api/v1/(.*)$ /$1 break;
    proxy_pass ${NGINX_BACKEND_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT};
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    add_header Cache-Control "no-cache, no-transform";
    add_header X-Accel-Buffering "no";
  }

  location /api/v1/ {
    rewrite ^/api/v1/(.*)$ /$1 break;
    proxy_pass ${NGINX_BACKEND_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT};
    proxy_send_timeout ${NGINX_PROXY_SEND_TIMEOUT};
    proxy_read_timeout ${NGINX_PROXY_READ_TIMEOUT};
  }
}
