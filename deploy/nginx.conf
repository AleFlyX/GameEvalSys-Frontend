server {
  listen ${NGINX_LISTEN_PORT};
  server_name ${NGINX_SERVER_NAME};

  root /usr/share/nginx/html;
  index index.html;

  # 让最后一层 Nginx 只信任上游代理，并把 X-Forwarded-For 还原成真实客户端 IP
  # 若本层作为最外层用户直接访问的一层，则把 NGINX_REAL_IP_FROM 设为一个不会命中的上游 IP，或保留默认值
  set_real_ip_from ${NGINX_REAL_IP_FROM};
  real_ip_header ${NGINX_REAL_IP_HEADER};
  real_ip_recursive ${NGINX_REAL_IP_RECURSIVE};

  sendfile on;
  tcp_nopush on;
  keepalive_timeout ${NGINX_KEEPALIVE_TIMEOUT};
  server_tokens ${NGINX_SERVER_TOKENS};

  gzip ${NGINX_GZIP};
  gzip_types ${NGINX_GZIP_TYPES};
  gzip_min_length ${NGINX_GZIP_MIN_LENGTH};

  # Vite + Vue Router history 模式
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 前端统一走 /api/v1，由 nginx 转发到后端
  # 后端实际接口为 /auth/login 等（无 /api/v1 前缀），这里显式去掉前缀
  location /api/v1/ {
    rewrite ^/api/v1/(.*)$ /$1 break;
    proxy_pass ${NGINX_BACKEND_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT};
    proxy_send_timeout ${NGINX_PROXY_SEND_TIMEOUT};
    proxy_read_timeout ${NGINX_PROXY_READ_TIMEOUT};
  }
}
