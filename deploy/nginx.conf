user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}
http {
  include /etc/nginx/mime.types;

  default_type application/octet-stream;

  # 让最后一层 Nginx 只信任上游代理，并把 X-Forwarded-For 还原成真实客户端 IP
  # 雷池waf的ip，因为雷池的源ip获取方式为上上一级代理中的地址，无需考虑前几层
  # 若本层作为最外用户直接访问的一层，则注释下面三行，并且不需要安装 realip 模块
  set_real_ip_from 192.168.1.255; # 替换为雷池waf的ip地址
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite + Vue Router history 模式
    location / {
      try_files $uri $uri/ /index.html;
    }

    # 前端统一走 /api/v1，由 nginx 转发到后端
    # 后端实际接口为 /auth/login 等（无 /api/v1 前缀），这里显式去掉前缀
    location /api/v1/ {
      rewrite ^/api/v1/(.*)$ /$1 break;
      proxy_pass http://host.docker.internal:8899;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
  }
}
