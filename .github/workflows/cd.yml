name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, gameeval_frontend]
    timeout-minutes: 15

    steps:
      # 1. 检出仓库代码到运行器的临时工作目录（$GITHUB_WORKSPACE）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main # 确保拉取 main 分支
          fetch-depth: 1 # 只需要最新提交，加快速度

      # 2. 下载 CI 构建产物 dist/ 到 deploy/cd/dist
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ${{ github.workspace }}/deploy/cd/dist

      # 3. 使用 Docker Compose 重新构建并启动容器
      #    注意：compose、.env 和 dist 都位于 deploy/cd 目录下
      - name: Rebuild and restart containers
        working-directory: ${{ github.workspace }}/deploy/cd
        run: |
          docker compose up -d --build --remove-orphans
