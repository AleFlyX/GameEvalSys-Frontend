name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md" # 忽略所有 md 文档
      - "docs/**" # 忽略 docs 目录
      - "**/*.txt" # 忽略文本文件
      - ".github/**/*.md" # 忽略 github 相关的文档
      - "LICENSE" # 忽略许可证文件
      - "**/.gitignore" # 忽略 gitignore
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**/*.txt"
      - ".github/**/*.md"
      - "LICENSE"
      - "**/.gitignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint gate
        run: npm run lint:check

      - name: Test gate (adaptive)
        shell: bash
        run: |
          SCRIPTS="$(npm run)"
          if echo "$SCRIPTS" | grep -q "test:gate"; then
            npm run test:gate
          elif echo "$SCRIPTS" | grep -q "test:unit"; then
            npm run test:unit
          elif echo "$SCRIPTS" | grep -q "test"; then
            npm test
          else
            echo "No test script found, skip test gate for now."
          fi

      - name: Build gate
        run: npm run build
